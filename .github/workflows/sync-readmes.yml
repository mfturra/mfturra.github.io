name: Sync Project READMEs

on:
  workflow_dispatch:   # Allow manual trigger
  schedule:
    - cron: '0 0 * * 1'  # Runs every Monday at midnight UTC

jobs:
  sync-readmes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v2
      - name: Fetch and wrap READMEs into index.md in subfolders
        run: |
          mkdir -p projects

          declare -A repos=(
            ["american-university-sim"]="mfturra/american-university-sim"
            ["professional-work"]="mfturra/professional-work"
            ["gpt-exploration"]="mfturra/gpt-exploration"
            ["occupations-cost"]="mfturra/occupations-cost"
            ["go-practice"]="mfturra/go-practice"
          )

          declare -A titles=(
            ["professional-work"]="Professional Work"
            ["occupations-cost"]="Occupations Cost"
            ["gpt-exploration"]="GPT Exploration"
            ["american-university-sim"]="American University Simulation"
            ["go-practice"]="Golang Exploration"
          )

          declare -A deploy_links=(
            ["occupations-cost"]="https://occupations-cost.onrender.com"
          )
          
          for folder in "${!repos[@]}"; do
            repo="${repos[$folder]}"
            title="${titles[$folder]}"
            mkdir -p "projects/$folder"

            curl -s "https://raw.githubusercontent.com/$repo/main/README.md" > "projects/$folder/temp.md"

            deploy_link="${deploy_links[$folder]}"

            {
              echo "---"
              echo "layout: page"
              echo "title: \"$title\""
              echo "permalink: /projects/$folder/"
              echo "---"
              echo ""
              if [[ -n "$deploy_link" ]]; then
                echo "**🌐 [View Deployed App]($deploy_link)**"
                echo ""
              fi
              grep -v '^# ' "projects/$folder/temp.md"
            } > "projects/$folder/index.md"

            rm "projects/$folder/temp.md"
          done
      - name: Checkout main branch
        run: |
          git fetch origin main
          git checkout main
          
      - name: Commit and push updates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/mfturra/mfturra.github.io.git
          git add projects/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync project READMEs to subfolders"
          git push origin main
